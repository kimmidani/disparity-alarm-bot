name: disparity-bot

on:
  schedule:
    - cron: '00 0 * * 1-5'
    - cron: '05 1 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pandas yfinance requests pytz
      - name: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        run: python bot.py
